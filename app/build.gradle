plugins {
    id 'com.android.application'
}

android {
    namespace 'in.nqas.checklist'
    compileSdk 35

    defaultConfig {
        applicationId 'in.nqas.checklist'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    sourceSets {
        main {
            assets.srcDirs = ["$buildDir/generated/web-assets"]
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def syncWebAssets = tasks.register('syncWebAssets', Sync) {
    from(rootProject.projectDir) {
        include 'index.html'
        include 'manifest.webmanifest'
        include 'sw.js'
    }
    from(rootProject.file('data')) {
        into 'data'
    }
    into(layout.buildDirectory.dir('generated/web-assets'))
}

tasks.configureEach { task ->
    if (task.name.startsWith('merge') && task.name.endsWith('Assets')) {
        task.dependsOn(syncWebAssets)
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
